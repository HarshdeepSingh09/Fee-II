<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        validateForm = () => {
            let username = document.getElementById("Username").value;
            let description = document.getElementById("description").value;
            let pwd1 = document.getElementById("pwd1").value;
            let pwd2 = document.getElementById("pwd2").value;

            if (username === "" || description === "" || pwd1 === "" || pwd2 === "") {
                alert("All fields must be filled out");
                return false;
            }

            if (pwd1 !== pwd2) {
                alert("Passwords do not match");
                return false;
            }
        }
    </script>
</head>
<body>
    <form action ="success.html" method="GET" name="Form!" onsubmit="return validateForm()">
        Username <input type="text" id="Username" name="Username"><br>
        Description <textarea cols="30" rows="2" id="description" name="description"></textarea><br>
        Password: <input type="password" id="pwd1" name="pwd1"><br>
        Retype Password: <input type="password" id="pwd2" name="pwd2"><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
