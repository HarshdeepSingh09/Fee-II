<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>    
        var d = new Date();

        document.write("<b>Locale String</b>" + d.toLocaleString() + "<br>");

        document.write("<b>Full month</b>" + d.toLocaleDateString() + "<br>");
    </script>
</body>
</html>
