<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        function showmsg() {
            fn = myform.fname.value;
            ln = myform.lname.value;
            document.getElementById("welcome_msg").innerText = 'Welcome ${fn} ${ln} !';
        }
    </script>
</head>
<body>
    <form name="myform">
        <h2 id ="welcome_msg"></h2>
        First name: <input type="text" id="fname"><br>
        Last name: <input type="text" id="lname"><br>
        <button type="button" onclick="showmsg()">CLick me!</button>
    </form>
</body>
</html>
