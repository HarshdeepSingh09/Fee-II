<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>function add() {
        let num1 = parseInt(prompt("Enter 1st num"));
        let num2 = parseInt(prompt("Enter 2nd num"));
        let num3 = parseInt(prompt("Enter 3rd num"));
        let num4 = parseInt(prompt("Enter 4th num"));
        let num5 = parseInt(prompt("Enter 5th num"));
        var add = num1 + num2 + num3 + num4 + num5;
        return add;
    }
    let sum = add();
    console.log(`Sum is: ${sum}`);
</script>
</body>
