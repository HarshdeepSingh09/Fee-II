<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center" id="hclass"></h1>
    <script>
        var num1 = parseInt(prompt("Enter number"))
        if(num1 %2 == 0){
            document.getElementById("hclass").innerHTML = num1 + " is Even "
        }
        else{
            document.getElementById("hclass").innerHTML = num1 + " is Odd "
        }
    </script>
</body>
</html>
