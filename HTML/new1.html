<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form > <!--method ="post" for sensitive data we use post method --> 
        First Name : <input type="text" name="fname">
        <input type="submit" value="Submit">
        <input type="color" name="color"> <!-- color picker -->
        <input type="range" name="range" min="0" max="100">
        <input type="text" list="planets">

        <datalist id="planets">
            <option value="Mercury"></option>
            <option value="Venus"></option>
            <option value="Earth"></option>
            <option value="Mars"></option>
            <option value="Jupiter"></option>
            <option value="Saturn"></option>
            <option value="Uranus"></option>
            <option value="Neptune"></option>
        </datalist>
    </form>
</body>
</html>
