<!DOCTYPE html>
<html>
<head>
    <title>CSS Exam</title>

    <style>
        body {
            margin: 0;
            background-color: lightgreen;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: cyan;
            border: 3px solid green;
            display: flex;
        }

        nav a {
            flex: 1;
            text-align: center;
            padding: 15px;
            border-right: 2px solid green;
            color: darkblue;
            text-decoration: none;
        }

        .content {
            padding-top: 80px;
        }

        h3 {
            margin: 60px 10px;
        }

        /* Red box right side */
        .box {
            width: 100px;
            height: 100px;
            background-color: red;
            position: sticky;
            top: 55px;
            margin-left: auto;
            margin-right: 20px;
            overflow: hidden;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

    </style>
</head>

<body>

    <nav>
        <a href="#">About Us</a>
        <a href="#">Home</a>
        <a href="#">Contact Us</a>
        <a href="#">Login</a>
        <a href="#">Logout</a>
    </nav>


    <div class="content">

        <h3>Services</h3>

        <div class="box">
            <img src="taj.webp" alt="Image">
        </div>

        <h3>Offers</h3>
        <h3>Clients</h3>
        <h3>Products</h3>
        <h3>Gallery</h3>
        <h3>Reviews</h3>
        <h3>Testimonials</h3>
        <h3>Our Team</h3>
        <h3>Contact Information</h3>
        <h3>Footer Section</h3>

    </div>

</body>
</html>
