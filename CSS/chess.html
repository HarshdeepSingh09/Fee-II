<html lang="en">

<title>ChessBoard</title>

        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#f4f4f4;
        font-family:Arial, sans-serif;
    }
    .board{
        width:500px;
        height:500px;
        margin:auto;
        display:grid;
        grid-template-columns:repeat(8,1fr);
        grid-template-rows:repeat(8,1fr);
        border:3px solid black;
        box-shadow:12px 12px 18px rgba(0,0,0,0.45);
    }
    .white{
        background:white;
    }
    .black{
        background:black;
    }
    .maroon{
        background:maroon;
    }
    .yellow{
        background:yellow;
    }
</style>
</head>
