<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 1200px;
            display: grid;
            text-align: center;
            padding: 20px;
            grid-template-columns: 200px 200px 200px;
            grid-template-rows: 200px 200px 200px;
            grid-column-gap :2px;
            grid-row-gap: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="item1" style="background-color: red;">item 1</div>
    <div class="item2" style="background-color: green;">item 2</div>
    <div class="item3" style="background-color: blue;">item 3</div>
    <div class="item4" style="background-color: lightblue;">item 4</div>
    <div class="item5" style="background-color: rgb(182, 255, 203);">item 5</div>
    <div class="item6" style="background-color: pink;">item 6</div>
    <div class="item7" style="background-color: darkblue;">item 7</div>
    <div class="item8" style="background-color: rgb(0, 139, 83);">item 8</div>
    <div class="item9" style="background-color: darkorange;">item 9</div>
</div>
</body>
</html>
