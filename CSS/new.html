<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whatsapp Layout Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Times New Roman, serif;
}
.container{
    display:grid;
    height:100vh;
    grid-template-areas:
    "header header header"
    "menu search contact"
    "menu chats messages"
    "menu chats type"
    "footer footer footer";
}
.header{
    grid-area:header;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:70px;
    border-bottom:3px solid black;
}
.menu{
    grid-area:menu;
    background:#565656ee;
    color:rgb(0, 0, 0);
    padding:0;
    border-right:1px solid black;
    text-align:center;
}
.search{
    grid-area:search;
    background:#2b2b2b;
    padding:20px;
    border-right:1px solid rgb(0, 0, 0);
    color:rgb(170, 170, 170);
}

.contact{
    grid-area:contact;
    background:#2b2b2b;
    padding:20px;
    color:rgb(170, 170, 170);
}
.chats{
    grid-area:chats;
    padding:8px;
    overflow-y:auto;
    border-top:1px solid gray;
    border-right:1px solid gray;
    background:#2b2b2b;
    color:rgb(170, 170, 170);
}
.messages{
    grid-area:messages;
    background-color:rgb(0, 0, 0);
    padding:8px;
    overflow-y:auto;
    border-top:1px solid gray;
    color:rgb(170, 170, 170);
    text-align:center;
}

.type{
    grid-area:type;
    background:#000000;
    padding:8px;
    display:flex;
    align-items:center;
    border-top:1px solid gray;
    color:rgb(170, 170, 170);
}

.footer{
    grid-area:footer;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:16px;
    color:#555;
}
h3{
    margin-bottom:15px;
    font-weight:normal;
}
p{
    margin-bottom:14px;
    line-height:1.6;
}



.chats::-webkit-scrollbar,
.messages::-webkit-scrollbar{

    width:8px;
}

.chats::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb{

    background:#888;
    border-radius:10px;
}

.chats::-webkit-scrollbar-thumb:hover,
.messages::-webkit-scrollbar-thumb:hover{

    background:#555;
}
</style>
<body>

<div class="container">


    <aside class="menu">
        <img src="Screenshot 2026-07-30 095925.png" width="90%" height="700px" alt="Logo">
    </aside>

    <section class="search">
        <img src="image.png" width="100%" height="30" alt="Search">
    </section>

    <section class="contact">
        Contact
        <img src="image4.png" width="100%" height="100%" alt="Contact">
    </section>

    <section class="chats">

        <img src="image1.png" width="100%" height="100%" alt="Contact">
        <img src="chats.png" width="100%" height="100%">
        
    </section>

    <section class="messages">
        <h3>Messages</h3>
        <img src="messages.png" width ="100%" height="100%">
       
    </section>

    <section class="type">
        Type
    </section>


</div>

</body>
</html>
