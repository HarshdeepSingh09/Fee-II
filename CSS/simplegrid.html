<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-rows: 100px 596px;
        }
        .header{
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 2;
        }
        .main{
            grid-row-start: 2;
            grid-row-end: 3;
            grid-column-start: 1;
            grid-column-end:2 ;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="head" style="background-color: grey;">Header</div>
        <div class="main" style="background-color: maroon;">Main</div>
    </div>
</body>
</html>
