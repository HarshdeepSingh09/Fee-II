<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 ~ p {
            font-size: 30px;
            text-shadow: 2px 2px 2px yellow;
        }
    </style>
</head>
<body>
    <div>
        <p>para above h1</p>
        <h1>H1 Heading</h1>
        <p>para below h1</p>
        <span>this is not a para</span>
        <p>this is another paragraph</p>
    </div>
</body>
</html>
